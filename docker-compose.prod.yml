# Упрощенный docker-compose для продакшена
# Используйте этот файл, если у вас уже есть внешние PostgreSQL и MinIO
version: '3.8'

services:
  bot:
    build: .
    container_name: oge_ege_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS:-}
      # Внешняя БД
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-oge_ege_bot}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Внешний Redis (опционально)
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Внешний MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-oge-ege-files}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      USE_MINIO: ${USE_MINIO:-true}
    volumes:
      - ./bot/data:/app/bot/data
    restart: unless-stopped
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

