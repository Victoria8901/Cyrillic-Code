version: '3.8'

services:
  # Telegram Bot
  bot:
    build: .
    container_name: oge_ege_bot
    # Применение миграций при первом запуске (если скрипт доступен)
    command: >
      sh -c "
      echo 'Проверка миграций БД...' ;
      if [ -f /app/bot/utils/apply_migrations.py ]; then
        python /app/bot/utils/apply_migrations.py || true;
      else
        echo 'Скрипт миграций не найден, пропускаю';
      fi;
      echo 'Запуск бота...' ;
      python -m bot.main
      "
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-oge_ege_bot}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./bot/data:/app/bot/data
    restart: unless-stopped
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge
